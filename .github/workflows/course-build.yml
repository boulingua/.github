# The one reusable workflow. Every course calls this and nothing else.
#
# ONE caller, not five. Four separate specifications each proposed their own
# reusable workflow; eighteen courses times five `uses:` blocks would be ninety
# call sites to keep in sync, and they would not stay in sync. This sequences
# every stage internally instead.
#
# It does NOT re-implement the gate battery. It checks out `kit` at a pinned tag
# and runs `bin/kit check --ci` — the same entry point an author runs locally.
# That is what makes "if it passes locally it passes in CI" true rather than
# aspirational, and it is why kit's CLI is on the critical path for every gate.
#
# Content policy lives in boulingua.yml. Foundation identities live in the
# explicit release lock; the shared caller supplies its identical org commit.
name: course-build

on:
  workflow_call:
    inputs:
      org_ref:
        description: "Required immutable commit, identical to the caller workflow uses ref and release-pins.json."
        type: string
        required: true

# The floor. Each job narrows further; nothing here grants write.
permissions:
  contents: read

jobs:
  # Two jobs, because gating and publishing are different privileges. `build`
  # needs read access and nothing else; only `deploy` claims pages: write and
  # the github-pages environment. One combined job would hand every pull
  # request the ability to publish, and a job-level `environment:` claims that
  # environment on every run whether or not it ever deploys.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout course
        uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install release contract validators
        run: pip install PyYAML==6.0.3 jsonschema==4.26.0

      - name: Verify the caller org pin before checking out its code
        env:
          ORG_REF: ${{ inputs.org_ref }}
        run: |
          python - <<'PYCODE'
          import json, os, pathlib, re, yaml
          ref = os.environ['ORG_REF']
          if not re.fullmatch(r'[a-f0-9]{40}', ref):
              raise SystemExit('org_ref must be an immutable 40-character commit')
          caller = yaml.load(pathlib.Path('.github/workflows/deploy.yml').read_text(), Loader=yaml.BaseLoader)
          job = caller['jobs']['course']
          lock = json.loads(pathlib.Path('release-pins.json').read_text())
          if job['uses'] != 'boulingua/.github/.github/workflows/course-build.yml@'+ref or job.get('with', {}).get('org_ref') != ref or lock['org']['commit'] != ref:
              raise SystemExit('caller workflow, explicit org_ref and release lock differ')
          PYCODE

      - name: Checkout org .github
        uses: actions/checkout@v4
        with:
          repository: boulingua/.github
          ref: ${{ inputs.org_ref }}
          path: .github-org
          fetch-depth: 0

      - name: Resolve the course release pins
        id: refs
        run: python .github-org/scripts/release_pins.py . --resolve-only --org-ref '${{ inputs.org_ref }}' --github-output "$GITHUB_OUTPUT"

      # kit and curriculum arrive as checkouts at a pinned tag. Never vendored,
      # never a submodule: a course repo contains content, not code.
      - name: Checkout kit
        uses: actions/checkout@v4
        with:
          repository: boulingua/kit
          ref: ${{ steps.refs.outputs.kit }}
          path: .kit
          fetch-depth: 0

      - name: Checkout curriculum
        uses: actions/checkout@v4
        with:
          repository: boulingua/curriculum
          ref: ${{ steps.refs.outputs.curriculum }}
          path: .curriculum
          fetch-depth: 0

      - name: Verify actual release checkouts and conformance schema
        run: python .github-org/scripts/release_pins.py . --org-ref '${{ inputs.org_ref }}' --kit .kit --curriculum .curriculum --org .github-org

      # go-version-file, always. A literal drifts from go.mod and the failure is
      # not a red build — it is a module graph that resolves differently here
      # than locally, which takes a day to find.
      - name: Set up Go
        uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with: { hugo-version: "0.159.2", extended: true }


      # No TeX Live, no LibreOffice, no Piper. Materials are committed and CI
      # verifies them; it does not generate them (ADR-0009). A TeX point release
      # must not silently reflow 360 documents between two deploys.
      - name: Install Python deps
        run: pip install --requirement .kit/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Install shared build tools
        run: npm ci --prefix .kit --no-audit --no-fund

      - name: Install browser for accessibility and interaction checks
        run: npm exec --prefix .kit -- playwright install --with-deps chromium

      - name: Install npm deps
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          elif [[ -f package.json ]]; then
            echo "package.json exists without a dependency lock" >&2
            exit 1
          else
            echo "No course-specific npm dependencies"
          fi
        shell: bash

      # Setup Pages MUST precede the build: it is what resolves base_url, and
      # Hugo bakes the baseURL into every canonical link, the sitemap and every
      # og:url at build time. Ordered the other way the expression is empty and
      # the site builds at "/" — which still deploys, still looks right when
      # clicked through, and is wrong in exactly the places nobody opens.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Use the checked kit for both rendering and checks
        run: |
          printf 'go 1.26.1\nuse ./.kit\n' > .hugo.work
          echo "HUGO_MODULE_WORKSPACE=$GITHUB_WORKSPACE/.hugo.work" >> "$GITHUB_ENV"

      - name: Build site
        run: python .kit/bin/kit build . --base-url "${{ steps.pages.outputs.base_url }}/"

      # THE BATTERY. One step, one entry point, the same one used locally.
      # Adding a gate here instead of to the battery breaks the equivalence and
      # is caught by kit's own drift test.
      # The owner roots are STATED, never derived. The workflow is the only
      # thing that knows where it put each checkout, so it is the only thing
      # entitled to say — and `kit check` now refuses to guess, which is what
      # turns a silently wrong path into a one-line failure.
      - name: kit check
        run: |
          python .kit/bin/kit check . --ci \
            --owner-root .github=.github-org \
            --owner-root curriculum=.curriculum

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: ./public }

  # Publishing is main-only and never runs for a pull request. A PR runs the
  # whole battery — stages A through D — and publishes nothing, which is the
  # point: a contributor gets the same verdict the author does, with none of
  # the access.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
