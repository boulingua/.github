# External link rot, weekly and ADVISORY.
#
# Deliberately not blocking and deliberately not part of `kit check`: a third
# party's outage is not this repo's defect, and a gate that fails for reasons
# outside the author's control is the exact shape of gate that gets suppressed.
# Two of the org's nine suppressions were lychee steps for precisely this
# reason. Advisory by design is the honest form of the same intent.
name: link-check
on:
  schedule: [{ cron: "0 7 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with: { args: "--no-progress --max-concurrency 4 ." }
        # No continue-on-error. The job is advisory because of WHEN it runs and
        # what it reports, not because its failures are hidden.
