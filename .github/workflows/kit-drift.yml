# Has a course grown code of its own?
#
# A course repo contains content, marks, materials, brand and configuration —
# no code. This is what makes that checkable rather than aspirational: a
# layouts/ or scripts/ directory appearing in a course means the shared surface
# has been forked, which is the failure the module was adopted to prevent.
name: kit-drift
on:
  schedule: [{ cron: "0 8 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml
      - name: Fetch the org
        run: |
          mkdir -p org && cd org
          for r in $(gh repo list boulingua --limit 100 --json name,isArchived \
                     -q '.[] | select(.isArchived|not) | .name'); do
            git clone --depth 1 -q "https://github.com/boulingua/$r.git" "$r"
          done
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Check for course-side code
        run: python scripts/kit_drift.py org
